<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header"><h1>Countries</h1></div>
    <table class="admin-table">
      <thead><tr><th>Code</th><th>Name</th><th>Currency</th><th>Legal Status</th><th>Actions</th></tr></thead>
      <tbody id="countriesTableBody"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
    </table>
    <h2 style="margin-top:30px">Add Country</h2>
    <form id="countryForm" class="admin-form">
      <div class="form-row">
        <div class="form-group"><label>Code *</label><input type="text" name="code" required placeholder="RW" maxlength="2"></div>
        <div class="form-group"><label>Name *</label><input type="text" name="name" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Currency</label><input type="text" name="currency" placeholder="USD"></div>
        <div class="form-group"><label>Language</label><input type="text" name="language" placeholder="English"></div>
      </div>
      <div class="form-group"><label>Legal Status</label><input type="text" name="legal_status" placeholder="legal / restricted / banned"></div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div id="countryFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="countrySubmitBtn">Create Country</button>
        <button type="button" class="btn btn--ghost btn--lg" id="countryCancelEdit" style="display:none" onclick="cancelCountryEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>
</div>
