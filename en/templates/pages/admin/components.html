<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header"><h1>Component Management</h1></div>

    <table class="admin-table">  
      <thead>  
        <tr><th>Name</th><th>Type</th><th>Status</th><th>Actions</th></tr>  
      </thead>  
      <tbody id="componentsTableBody">  
        <tr><td colspan="4" class="muted">Loading...</td></tr>  
      </tbody>  
    </table>

    <h2 style="margin-top:40px">Create Component</h2>
    <form id="componentForm" class="admin-form">
      <input type="hidden" name="id" id="componentId" value="">
      <div class="form-row">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" name="name" required placeholder="e.g. Homepage Hero">
        </div>
        <div class="form-group">
          <label>Slug (optional)</label>
          <input type="text" name="slug" placeholder="e.g. home-hero">
        </div>
        <div class="form-group">
          <label>Type *</label>
          <select name="type" id="componentType" required>
            <option value="author">Author</option>
            <option value="faq_group">FAQ Group</option>
            <option value="text">Text Block</option>
            <option value="html">Custom HTML</option>
            <option value="cta">CTA (Call to Action)</option>
            <option value="hero">Hero Section</option>
            <option value="casino_grid">Casino Grid</option>
            <option value="banner">Banner</option>
            <option value="comparison_table">Comparison Table</option>
            <option value="news_feed">News Feed</option>
            <option value="ad">ad</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" placeholder="Section heading (optional)">
      </div>

      <div class="form-group">
        <label>Content <span id="contentHint" class="muted" style="font-weight:normal;font-size:12px"></span></label>
        <textarea name="content" id="componentContent" style="min-height:200px" placeholder='For author: JSON like {"name":"Elie","title":"Founder","bio":"...","avatar":"https://..."}&#10;For FAQ group: JSON array like [{"q":"Question?","a":"Answer"}]&#10;For text/html: raw HTML or text'></textarea>
      </div>

      <div class="form-group">
        <label>Settings (JSON, optional)</label>
        <textarea name="settings_json" style="min-height:80px" placeholder='e.g. {"limit":5,"country":"global","link":"https://...","button_text":"Visit"}'></textarea>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="active">Active</option>
          <option value="draft">Draft</option>
          <option value="archived">Archived</option>
        </select>
      </div>

      <div id="componentFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="componentSubmitBtn">Create Component</button>
        <button type="button" class="btn btn--ghost btn--lg" id="componentCancelEdit" style="display:none" onclick="cancelComponentEdit()">Cancel Edit</button>
      </div>
    </form>

    <!-- Assign component to page -->
    <h2 style="margin-top:40px">Assign Component to Page</h2>
    <form id="assignForm" class="admin-form">
      <div class="form-row">
        <div class="form-group">
          <label>Component *</label>
          <select name="component_id" id="assignComponentSelect" required>
            <option value="">Select component...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Page Type *</label>
          <select name="page_type" required>
            <option value="homepage">Homepage</option>
            <option value="review">Review (individual)</option>
            <option value="casino">Casino (individual)</option>
            <option value="country">Country (individual)</option>
            <option value="category">Category (individual)</option>
            <option value="news">News Article (individual)</option>
            <option value="update">Platform Update (individual)</option>
            <option value="page">Static Page (individual)</option>
            <option value="casino_list">Casino Listing Page (/en/casino)</option>
            <option value="review_list">Review Listing Page (/en/review)</option>
            <option value="news_list">News Listing Page (/en/news)</option>
            <option value="updates_list">Platform Updates Listing Page (/en/updates)</option>
            <option value="category_list">Category Listing Page (/en/category)</option>
            <option value="country_list">Country Listing Page (/en/country)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Page Slug *</label>
          <input type="text" name="page_slug" required placeholder="e.g. homepage, fresh-casino-review, RW, crypto — use * for ALL pages of this type">
        </div>
        <div class="form-group">
          <label>Injection Point *</label>
          <select name="injection_point" required>
            <option value="content_bottom">Content Bottom (default)</option>
            <option value="content_top">Content Top</option>
            <option value="top">Page Top (above everything)</option>
            <option value="bottom">Page Bottom (below everything)</option>
            <option value="sidebar">Sidebar</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Position (lower renders first)</label>
        <input type="number" name="position" value="0">
      </div>
      <div id="assignFormAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Assign to Page</button>
    </form>

    <!-- Current assignments -->
    <h2 style="margin-top:40px">Current Page Assignments</h2>
    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group">
        <select id="filterPageType" onchange="loadAssignments()">
          <option value="">All page types</option>
          <option value="homepage">Homepage</option>
          <option value="review">Review</option>
          <option value="casino">Casino</option>
          <option value="country">Country</option>
          <option value="category">Category</option>
          <option value="news">News</option>
          <option value="update">Platform Update</option>
          <option value="page">Static Page</option>
          <option value="author">Author</option>
          <option value="casino_list">Casino Listing Page</option>
          <option value="review_list">Review Listing Page</option>
          <option value="news_list">News Listing Page</option>
          <option value="updates_list">Platform Updates Listing Page</option>
          <option value="category_list">Category Listing Page</option>
          <option value="country_list">Country Listing Page</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="filterPageSlug" placeholder="Page slug (optional)" oninput="loadAssignments()">
      </div>
    </div>
    <table class="admin-table">
      <thead>
        <tr><th>Page</th><th>Component</th><th>Type</th><th>Pos</th><th>Injection</th><th>Enabled</th><th>Actions</th></tr>
      </thead>
      <tbody id="assignmentsTableBody">
        <tr><td colspan="7" class="muted">Loading...</td></tr>
      </tbody>
    </table>

  </div>
</div>
