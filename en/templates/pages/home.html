<h1>Best Online Casinos</h1>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0f1a;
color:#fff;
}

.hero{
padding:80px 20px;
text-align:center;
background:linear-gradient(135deg,#141e30,#243b55);
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
opacity:.9;
max-width:700px;
margin:auto;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.casino-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:24px;
}

.casino-card{
background:#151c2e;
border-radius:14px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
transition:.25s;
}

.casino-card:hover{
transform:translateY(-6px);
}

.featured{
border:2px solid gold;
}

.featured-badge{
display:inline-block;
background:gold;
color:#000;
font-weight:bold;
padding:5px 10px;
border-radius:5px;
margin-bottom:12px;
font-size:12px;
}

.card-header{
display:flex;
gap:14px;
align-items:center;
margin-bottom:15px;
}

.casino-logo{
width:60px;
height:60px;
object-fit:contain;
background:#fff;
border-radius:10px;
padding:6px;
}

.card-header h3{
margin:0;
font-size:20px;
}

.rating{
margin-top:6px;
font-size:14px;
}

.stars{
color:gold;
margin-right:5px;
}

.bonus-box{
background:#0d1426;
padding:12px;
border-radius:10px;
margin-bottom:14px;
}

.bonus-title{
font-size:13px;
opacity:.75;
}

.bonus-value{
font-size:18px;
font-weight:bold;
margin-top:4px;
}

.features{
margin-bottom:18px;
}

.tag{
display:inline-block;
background:#273552;
padding:6px 10px;
border-radius:20px;
font-size:12px;
margin:3px;
}

.card-footer{
display:flex;
gap:10px;
}

.btn{
flex:1;
text-align:center;
padding:12px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.btn-primary{
background:#00c853;
color:white;
}

.btn-primary:hover{
background:#00b248;
}

.btn-secondary{
background:#243b55;
color:white;
}

.loading,
.empty-state{
padding:60px;
text-align:center;
font-size:18px;
opacity:.7;
}
</style>

<section class="hero">
  <div class="hero-content">
    <h1>Premium Casino Reviews & Bonuses</h1>
    <p>Discover the world's most trusted online casinos with exclusive VIP bonuses and expert reviews.</p>
  </div>
</section>

<section class="casino-listings">
  <div class="container">
    <h2>Top Rated Casinos</h2>

    <div id="casino-grid" class="casino-grid">
      <div class="loading">Loading casinos...</div>
    </div>
  </div>
</section>

<script>
const casinoData = {{casinos}};

function renderStars(rating) {
  rating = Math.round(Number(rating) || 0);
  return "★".repeat(rating) + "☆".repeat(5 - rating);
}

function renderCasinos() {
  const grid = document.getElementById("casino-grid");

  if (!Array.isArray(casinoData) || casinoData.length === 0) {
    grid.innerHTML = "<div class='empty-state'>No casinos available.</div>";
    return;
  }

  casinoData.sort((a, b) => (b.featured || 0) - (a.featured || 0));

  grid.innerHTML = casinoData.map(casino => {
    let features = [];

    try {
      features = JSON.parse(casino.features || "[]");
    } catch (e) {}

    return `
      <article class="casino-card ${casino.featured ? "featured" : ""}">
        <h3>${casino.name}</h3>
        <p>${casino.bonus_value || ""}</p>
      </article>
    `;
  }).join("");
}

renderCasinos();
</script>
