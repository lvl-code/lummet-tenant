<article class="news-detail">
  <div class="container">
    {{components_top}}
    <header class="news-header">
      <h1>{{title}}</h1>
      <div class="news-meta">
        {{#if author_name}}
        <div style="display:flex;align-items:center;gap:8px">
          {{#if author_avatar}}<img src="{{author_avatar}}" alt="{{author_name}}" style="width:32px;height:32px;border-radius:50%" onerror="this.src='/static/images/default.png'">{{/if}}
          <span>By <a href="/en/author/{{author_slug}}">{{author_name}}</a></span>
        </div>
        {{/if}}

        <div class="news-dates" style="margin-top:10px">
          <span><strong>Published:</strong> {{created_at}}</span>
          &nbsp;•&nbsp;
          <span><strong>Updated:</strong> {{updated_at}}</span>
        </div>
      </div>
    </header>
    <div class="news-content">
      {{content}}
      {{components_content_top}}
      {{components_content_bottom}}
    </div>
    {{components_bottom}}
  </div>
</article>
