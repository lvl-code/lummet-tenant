<section class="section component-casino-grid">
  <div class="container">
    {{#if title}}<div class="section-header"><h2>{{title}}</h2></div>{{/if}}
    <div class="casino-grid" id="componentCasinoGrid">
      <p class="muted">Loading casinos...</p>
    </div>
  </div>
</section>
<script>
(async () => {
  const grid = document.getElementById("componentCasinoGrid");
  if (!grid) return;
  try {
    const res = await fetch("/en/api/v1/public/casinos/list");
    const data = await res.json();
    const casinos = (data.casinos || []).slice(0, {{limit}});
    if (casinos.length === 0) { grid.innerHTML = '<p class="muted">No casinos yet.</p>'; return; }
    grid.innerHTML = casinos.map(c => `
      <div class="casino-card">
        <div class="casino-card__header">
          <img src="${c.logo || '/static/images/logo.png'}" alt="${c.name}" class="casino-card__logo" onerror="this.src='/static/images/logo.png'" loading="lazy">
          <div class="casino-card__rating">${'★'.repeat(Math.round(c.rating||0))}${'☆'.repeat(5-Math.round(c.rating||0))}</div>
        </div>
        <div class="casino-card__body">
          <h3>${c.name}</h3>
        </div>
        <div class="casino-card__actions">
          <a href="/en/casino/${c.slug}" class="btn btn--secondary">Review</a>
          <a href="/en/go/${c.slug}" class="btn btn--primary" rel="nofollow sponsored">Visit</a>
        </div>
      </div>
    `).join("");
  } catch { grid.innerHTML = '<p class="muted">Failed to load.</p>'; }
})();
</script>
