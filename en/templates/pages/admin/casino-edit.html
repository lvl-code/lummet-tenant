<div class="admin-wrapper">
  <nav class="admin-nav">
    <a href="/en/dashboard">Overview</a>
    <a href="/en/dashboard/casinos">Casinos</a>
    <a href="/en/dashboard/casino/create">Add Casino</a>
    <a href="/en/dashboard/reviews">Reviews</a>
    <a href="/en/dashboard/news">News</a>
    <a href="/en/dashboard/pages">Pages</a>
    <a href="/en/dashboard/categories">Categories</a>
    <a href="/en/dashboard/countries">Countries</a>
    <a href="/en/dashboard/settings">Settings</a>
    <a href="/en/dashboard/ai">AI Generator</a>
    <a href="/api/v1/auth/logout" class="admin-logout">Logout</a>
  </nav>
  <div class="admin-content">
    <h1>Edit Casino</h1>
    <form id="casinoEditForm" class="admin-form" data-slug="{{slug}}">
      <div class="form-row">
        <div class="form-group"><label>Name *</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Logo URL</label><input type="text" name="logo"></div>
        <div class="form-group"><label>Website URL *</label><input type="text" name="website_url" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Affiliate URL *</label><input type="text" name="affiliate_url" required></div>
        <div class="form-group"><label>Rating (0-5)</label><input type="number" name="rating" min="0" max="5" step="0.1" value="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Bonus Title</label><input type="text" name="bonus_title"></div>
        <div class="form-group"><label>Bonus Value</label><input type="text" name="bonus_value"></div>
      </div>
      <div class="form-group"><label>Features (comma-separated)</label><input type="text" name="features"></div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Featured (0 or 1)</label><input type="number" name="featured" min="0" max="1" value="0"></div>
        <div class="form-group"><label>Sort Order</label><input type="number" name="sort_order" value="0"></div>
        <div class="form-group"><label>Status</label><select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></div>
      </div>
      <div id="casinoEditAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Update Casino</button>
    </form>
  </div>
</div>
