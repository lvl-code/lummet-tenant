<header class="site-header">
  <div class="container header-inner">
    <a
  href="/en"
  class="logo"
  aria-label="{{site_name}}"
>
  <img
    src="{{site_logo}}"
    alt="{{site_name}}"
    class="logo-icon"
    width="40"
    height="40"
    loading="eager"
  >

  <span class="logo-text">
    {{site_name}}
  </span>
</a>
    <nav class="main-nav" id="mainNav">
      {{header_nav}}
    </nav>
    <div class="header-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search casinos..." autocomplete="off">
        <div id="searchResults" class="search-results"></div>
      </div>
      <button class="mobile-search-btn" id="mobileSearchBtn" aria-label="Search">&#128269;</button>
      <a href="/en/login" class="btn btn--ghost" id="headerLoginBtn">Login</a>
      <a href="/en/api/v1/auth/logout" class="btn btn--ghost" id="headerLogoutBtn" style="display:none">LO</a>
      <a href="/en/dashboard" class="btn btn--ghost" id="headerDashboardBtn" style="display:none">DB</a>

      <button class="nav-toggle" id="navToggle" aria-label="Menu">&#9776;</button>
    </div>
  </div>
  <div class="mobile-search-container" id="mobileSearchContainer">
    <input type="text" id="mobileSearchInput" placeholder="Search casinos..." autocomplete="off">
    <button class="mobile-search-close" id="mobileSearchClose" aria-label="Close search">&times;</button>
    <div id="mobileSearchResults" class="search-results" style="position:absolute;top:100%;left:0;right:0;"></div>
  </div>
</header>
