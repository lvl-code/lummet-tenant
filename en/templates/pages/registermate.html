<div class="max-w-md mx-auto mt-16 bg-gray-900 p-8 rounded-xl">

    <h1 class="text-3xl font-bold mb-6">
        Register
    </h1>

    <form id="registerForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            class="w-full mb-4 p-3 rounded bg-gray-800"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            class="w-full mb-4 p-3 rounded bg-gray-800"
        >

        <button
            class="w-full bg-green-600 py-3 rounded"
        >
            Create Account
        </button>

    </form>

    <div
        id="message"
        class="mt-4 text-center"
    ></div>

</div>

<script>
document
.getElementById("registerForm")
.addEventListener(
"submit",
async e => {

e.preventDefault();

const res =
await fetch(
"/api/v1/auth/register",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:
document.getElementById("email").value,
password:
document.getElementById("password").value
})
}
);

const data =
await res.json();

if(data.success){

location.href =
"/en/login";

}else{

document.getElementById(
"message"
).innerHTML =
data.error;

}
});
</script>
