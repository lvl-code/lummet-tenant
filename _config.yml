title: Level.casino
description: Data-driven casino intelligence platform
url: "https://level.casino"
baseurl: ""

# GitHub Pages compatible build
markdown: kramdown
highlighter: rouge
theme: jekyll-theme-primer

# Plugins (ONLY GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

# Collections (Programmatic SEO Engine)
collections:
  seo_pages:
    output: true
    permalink: /:location_slug/:category_slug/

# Default values (FAILSAFE — prevents full build crash)
defaults:
  - scope:
      path: ""
      type: seo_pages
    values:
      layout: seo_page
      location_name: "Global"
      location_slug: "global"
      category_title: "Casino Guide"
      category_slug: "general"

# Permalink style for normal pages
permalink: pretty

# Exclude unnecessary files from build
exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# Include important static files
include:
  - _pages

# SEO (jekyll-seo-tag defaults)
twitter:
  username: levelcasino

social:
  name: Level Casino
  links:
    - https://level.casino

# Build performance / stability
incremental: false

# Collections output control
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-default.jpg

# Optional: future-proof structure
collections_dir: ""

# Strict front matter handling
strict_front_matter: false
