<p>
Welcome to LevelCasino.
</p>

<!-- templates/pages/home.html -->

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: #fff;
  }

  .hero {
    padding: 80px 20px;
    text-align: center;
    background: linear-gradient(135deg, #141e30, #243b55);
  }

  .hero h1 {
    font-size: 42px;
    margin-bottom: 10px;
  }

  .hero p {
    font-size: 18px;
    opacity: 0.85;
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
  }

  .casino-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .casino-card {
    background: #151c2e;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .featured {
    border: 2px solid gold;
  }

  .featured-badge {
    background: gold;
    color: #000;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 5px;
    display: inline-block;
    margin-bottom: 10px;
  }

  .card-header {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .casino-logo {
    width: 50px;
    height: 50px;
    object-fit: contain;
  }

  .rating {
    font-size: 14px;
  }

  .stars {
    color: gold;
  }

  .bonus-box {
    background: #0f1628;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
  }

  .bonus-value {
    color: #00ff99;
  }

  .tag {
    display: inline-block;
    background: #2b3550;
    padding: 4px 8px;
    margin: 2px;
    border-radius: 5px;
    font-size: 12px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
  }

  .btn {
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
  }

  .btn-primary {
    background: #00c853;
    color: #fff;
  }

  .btn-secondary {
    background: #1e2a44;
    color: #fff;
  }

  .loading {
    text-align: center;
    padding: 40px;
    opacity: 0.7;
  }
</style>

<section class="hero">
  <h1>Premium Casino Reviews & Bonuses</h1>
  <p>Discover the world's most trusted online casinos with exclusive VIP bonuses and expert reviews.</p>
</section>

<section class="casino-listings">
  <div class="container">
    <h2>Top Rated Casinos</h2>
    <div id="casino-grid" class="casino-grid">
      <div class="loading">Loading casinos...</div>
    </div>
  </div>
</section>

<script>
  function renderStars(rating = 0) {
    const stars = Math.round(rating);
    return "★".repeat(stars) + "☆".repeat(5 - stars);
  }

  async function loadCasinos() {
    const grid = document.getElementById("casino-grid");

    try {
      const res = await fetch("/api/v1/casinos/list");
      const data = await res.json();

      const casinos = data.casinos || [];

      if (!casinos.length) {
        grid.innerHTML = "<div class='loading'>No casinos available.</div>";
        return;
      }

      const sorted = casinos.sort((a, b) =>
        (b.featured || 0) - (a.featured || 0)
      );

      grid.innerHTML = sorted.map(casino => {
        let features = [];
        try {
          features = JSON.parse(casino.features || "[]");
        } catch (e) {}

        const tags = features.slice(0, 3)
          .map(f => `<span class="tag">${f}</span>`)
          .join("");

        return `
          <article class="casino-card ${casino.featured ? "featured" : ""}">
            ${casino.featured ? `<div class="featured-badge">FEATURED</div>` : ""}

            <div class="card-header">
              <img src="${casino.logo || "/en/static/images/logo.png"}" class="casino-logo">
              <div>
                <h3>${casino.name}</h3>
                <div class="rating">
                  <span class="stars">${renderStars(casino.rating)}</span>
                  ${casino.rating || "0.0"}/5
                </div>
              </div>
            </div>

            <div class="bonus-box">
              <div>${casino.bonus_title || "Bonus"}</div>
              <div class="bonus-value">${casino.bonus_value || ""}</div>
            </div>

            <div>${tags}</div>

            <div class="card-footer">
              <a class="btn btn-primary" href="/en/go/${casino.slug}" target="_blank">
                Play Now
              </a>
              <a class="btn btn-secondary" href="/en/casino/${casino.slug}">
                Review
              </a>
            </div>
          </article>
        `;
      }).join("");

    } catch (err) {
      console.error("Casino load failed:", err);
      grid.innerHTML = "<div class='loading'>Failed to load casinos.</div>";
    }
  }

  document.addEventListener("DOMContentLoaded", loadCasinos);
</script>
