<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Level.casino</title>
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://level.casino/dashboard/">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.ico">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="/css/merged.css">
    <style>
        .dash-container {
            max-width: 1000px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .dash-header h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
        }
        .dash-logout {
            padding: 8px 20px;
            font-size: 0.85rem;
        }
        .dash-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }
        .stat-card .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--electric-purple);
        }
        .stat-card .stat-label {
            color: #999;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .dash-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .dash-table th, .dash-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #222;
            font-size: 0.9rem;
        }
        .dash-table th {
            color: #999;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dash-table td {
            color: #ddd;
        }
        .dash-table tr:hover {
            background: rgba(157,80,187,0.05);
        }
        .dash-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .dash-section h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
            font-size: 1.2rem;
        }
        .login-prompt {
            text-align: center;
            padding: 100px 20px;
        }
        .login-prompt h2 {
            font-family: 'Orbitron', sans-serif;
        }
        .login-prompt a {
            color: var(--electric-purple);
        }


        /* Responsive improvements */

* {
    box-sizing: border-box;
}

img {
    max-width: 100%;
    height: auto;
}

.dash-stats {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

.dash-section {
    overflow: hidden;
}

@media (max-width: 768px) {

    .dash-container {
        padding: 0 12px;
    }

    .dash-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }

    .dash-table {
        display: block;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .dash-table th,
    .dash-table td {
        padding: 10px;
        font-size: 0.85rem;
    }

    .stat-card .stat-value {
        font-size: 1.5rem;
    }

    .dash-section {
        padding: 20px;
    }

    .dash-header h1 {
        font-size: 1.5rem;
    }

    .dash-logout {
        width: 100%;
    }
}
        * {
    max-width: 100%;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

.dash-container {
    width: 100%;
        }
    </style>
</head>
<body>
    {% include header.html %}

    <section class="dash-container">
        <div id="dash-content">
            <div class="login-prompt">
                <h2>Loading...</h2>
            </div>
        </div>
    </section>

    {% include footer.html %}

    <script>
        async function loadDashboard() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            const container = document.getElementById('dash-content');

            if (!token || !userStr) {
                container.innerHTML = `
                    <div class="login-prompt">
                        <h2>Please <a href="/login/">login</a> to view your dashboard</h2>
                    </div>`;
                return;
            }

            const user = JSON.parse(userStr);

            // Verify token is still valid
            try {
                const meRes = await fetch('/api/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!meRes.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    container.innerHTML = `
                        <div class="login-prompt">
                            <h2>Session expired. <a href="/login/">Login again</a></h2>
                        </div>`;
                    return;
                }
            } catch (err) {
                // Continue even if /api/me fails
            }

            // Load stats - API returns raw array
            let statsHtml = '';
            try {
                const statsRes = await fetch('/api/stats');
                const statsData = await statsRes.json();
                const stats = Array.isArray(statsData) ? statsData : (statsData.stats || []);

                const totalClicks = stats.reduce((sum, s) => sum + (s.click_count || 0), 0);
                const casinoCount = stats.length;

                statsHtml = `
    <div class="dash-header">
        <h1><span class="hero-highlight">Dashboard</span></h1>
        <button class="btn-main btn-purple dash-logout" onclick="logout()">Logout</button>
    </div>

    <div class="dash-section">
        <h2>🚧 Dashboard Features in Development</h2>
        <p style="color:#bbb;line-height:1.8;">
            Thank you for creating an account on Level.casino.
            Additional dashboard features are currently being developed and will be released in future updates.
        </p>
        <p style="color:#999;">
            Please check back later for account management, favorite casinos, personalized recommendations, activity history, saved comparisons, and other member features.
        </p>
    </div>

    <div class="dash-stats">

        
    
                        <div class="stat-card">
                            <div class="stat-value">${totalClicks}</div>
                            <div class="stat-label">Total Clicks</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${casinoCount}</div>
                            <div class="stat-label">Casinos Tracked</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${user.username || 'User'}</div>
                            <div class="stat-label">Account</div>
                        </div>
                    </div>
                    <div class="dash-section">
                        <h2>Click Stats by Casino</h2>
                        <table class="dash-table">
                            <thead>
                                <tr>
                                    <th>Casino</th>
                                    <th>Clicks</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${stats.length > 0 ? stats.map(s => `
                                    <tr>
                                        <td>${s.casino_id}</td>
                                        <td>${s.click_count}</td>
                                    </tr>
                                `).join('') : '<tr><td colspan="2">No clicks tracked yet</td></tr>'}
                            </tbody>
                        </table>
                    </div>`;
            } catch (err) {
                statsHtml = `
                    <div class="dash-header">
                        <h1><span class="hero-highlight">Dashboard</span></h1>
                        <button class="btn-main btn-purple dash-logout" onclick="logout()">Logout</button>
                    </div>
                    <div class="dash-section">
                        <h2>Click Stats by Casino</h2>
                        <p style="color:#999;">No clicks tracked yet.</p>
                    </div>`;
            }

            // Load casinos - API returns raw array
            let casinosHtml = '';
            try {
                const casinosRes = await fetch('/api/casinos');
                const casinosData = await casinosRes.json();
                const casinos = Array.isArray(casinosData) ? casinosData : (casinosData.casinos || []);

                if (casinos.length > 0) {
                    casinosHtml = `
                        <div class="dash-section">
                            <h2>Casinos (${casinos.length})</h2>
                            <table class="dash-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Score</th>
                                        <th>Bonus</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${casinos.map(c => `
                                        <tr>
                                            <td>${c.id}</td>
                                            <td>${c.name}</td>
                                            <td>${c.score}</td>
                                            <td>${c.bonus_title || '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                }
            } catch (err) {
                // Skip casinos section
            }

            container.innerHTML = statsHtml + casinosHtml;
        }

        function logout() {
            const token = localStorage.getItem('token');
            if (token) {
                fetch('/api/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                }).catch(() => {});
            }
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login/';
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
