<h1>Best Online Casinos</h1>

<p>
Welcome to LevelCasino.
</p>

{{casinos}}

  <meta charset="UTF-8">
  <title>{{seo_title}}</title>
  <meta name="description" content="{{seo_description}}">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      font-size: 14px;
    }

    /* GRID */
    .casino-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .casino-card {
      background: #151c2e;
      border-radius: 12px;
      padding: 15px;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .casino-card:hover {
      transform: translateY(-4px);
      border-color: #ffcc00;
    }

    .casino-logo {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #0e1322;
      border-radius: 10px;
      padding: 10px;
    }

    .casino-name {
      font-size: 18px;
      margin: 10px 0 5px;
    }

    .bonus {
      color: #ffcc00;
      font-weight: bold;
      font-size: 14px;
    }

    .rating {
      font-size: 13px;
      color: #aaa;
      margin: 5px 0;
    }

    .btn {
      display: block;
      text-align: center;
      margin-top: 10px;
      padding: 10px;
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn:hover {
      background: #ffd84d;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #0e1322;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .brand {
      font-weight: bold;
      color: #ffcc00;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: none;
      outline: none;
      width: 200px;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 24px; }
      input { width: 120px; }
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="brand">LEVEL.CASINO</div>
  <input type="text" id="search" placeholder="Search casino...">
</div>

<div class="container">

  <div class="hero">
    <h1>Top Online Casinos Reviewed</h1>
    <p>Compare bonuses, ratings & trusted operators worldwide</p>
  </div>

  <div id="casinoGrid" class="casino-grid"></div>

</div>

<script>
  // backend injection (IMPORTANT)
  const casinos = JSON.parse('{{casinos}}');

  const grid = document.getElementById("casinoGrid");
  const search = document.getElementById("search");

  function render(list) {
    grid.innerHTML = "";

    list.forEach(c => {
      const card = document.createElement("div");
      card.className = "casino-card";

      card.innerHTML = `
        <img class="casino-logo" src="${c.logo}" alt="${c.name}">
        <div class="casino-name">${c.name}</div>
        <div class="bonus">${c.bonus_title} - ${c.bonus_value}</div>
        <div class="rating">⭐ Rating: ${c.rating}/5</div>
        <a class="btn" href="${c.affiliate_url}" target="_blank">Play Now</a>
      `;

      grid.appendChild(card);
    });
  }

  render(casinos);

  search.addEventListener("input", e => {
    const q = e.target.value.toLowerCase();

    const filtered = casinos.filter(c =>
      c.name.toLowerCase().includes(q)
    );

    render(filtered);
  });
</script>
