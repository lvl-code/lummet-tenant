<article class="review-detail">
  <div class="container">
    <header class="review-header">
      {{casino_card_html}}
      <h1>{{title}}</h1>
      <div class="review-meta">
        <span class="rating-stars">{{rating}} / 5</span>
      </div>
    </header>
    <div class="review-body">
      <div class="review-content">
  <p>{{overview}}</p>

  <h2>Games</h2>
  <p>{{games}}</p>

  <h2>Bonuses</h2>
  <p>{{bonuses}}</p>

  <h2>Payment Methods</h2>
  <p>{{payments}}</p>

  <h2>Licensing</h2>
  <p>{{licenses}}</p>

  {{content}}

  <h2>Verdict</h2>
  <p>{{verdict}}</p>
</div>

      <div class="review-pros-cons">
        <div class="pros-cons-block pros">
          <h3>Pros</h3>
          {{pros_html}}
        </div>
        <div class="pros-cons-block cons">
          <h3>Cons</h3>
          {{cons_html}}
        </div>
      </div>
    </div>
    <div class="review-cta">
      <div class="geo-availability" style="margin-bottom:16px;font-size:18px;">
        {{geo_flag}} <span class="geo-{{geo_status}}" style="font-weight:600;">{{geo_status}}</span> in {{geo_country}}
      </div>
      <a href="/en/go/{{casino_slug}}" class="btn btn--primary btn--lg" rel="nofollow sponsored">Visit Casino</a>
    </div>
  </div>
</article>
