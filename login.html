<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Level.casino</title>
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://level.casino/login/">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.ico">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="/css/merged.css">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 140px auto 60px;
            padding: 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            border-radius: 20px;
        }
        .auth-container h1 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 30px;
        }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: #0f172a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--electric-purple);
        }
        .auth-form button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9rem;
        }
        .auth-link a {
            color: var(--electric-purple);
            text-decoration: none;
        }
        .auth-error {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    {% include header.html %}

    <section class="auth-container">
        <h1><span class="hero-highlight">Login</span></h1>
        <div class="auth-error" id="auth-error"></div>
        <form class="auth-form" id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn-main btn-purple">Sign In</button>
        </form>
        <div class="auth-link">
            Don't have an account? <a href="/register/">Register</a>
        </div>
    </section>

    {% include footer.html %}

    <script>
        const errorEl = document.getElementById('auth-error');
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard/';
            } catch (err) {
                errorEl.textContent = 'Connection error';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
