<div class="admin-wrapper">
  {{admin_nav}}

  <div class="admin-content">
    <div class="admin-header">
      <h1>Edit Comparison</h1>
      <a href="/en/dashboard/comparisons" class="btn btn--ghost">Back to List</a>
    </div>

    <div id="comparisonEditAlert" class="alert" style="display:none"></div>

    <form id="comparisonEditForm" class="admin-form" data-compare-type="{{compare_type}}" data-slug="{{slug}}">
      <p><strong>Type:</strong> {{compare_type}} &nbsp; <strong>Slug:</strong> {{slug}}</p>

      <label>Title <input type="text" name="title" required></label>
      <label>Description <textarea name="description" rows="3"></textarea></label>
      <label>Status
        <select name="status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </label>

      <fieldset>
        <legend>Items to Compare</legend>
        <div id="itemRows"></div>
        <button type="button" id="addItemRowBtn" class="btn btn--ghost btn--sm">+ Add Item</button>
      </fieldset>

      <fieldset>
        <legend>Criteria</legend>
        <div id="criterionRows"></div>
        <button type="button" id="addCriterionRowBtn" class="btn btn--ghost btn--sm">+ Add Criterion</button>
      </fieldset>

      <fieldset>
        <legend>Editorial Pick (optional)</legend>
        <label>Item Content Type
          <select name="editorial_selection_item_type">
            <option value="">None</option>
            <option value="casino">Casino</option>
            <option value="sportsbook">Sportsbook</option>
            <option value="affiliate_partner">Affiliate Partner</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label>Item ID <input type="number" name="editorial_selection_item_id"></label>
      </fieldset>

      <fieldset>
        <legend>SEO</legend>
        <label>SEO Title <input type="text" name="seo_title"></label>
        <label>SEO Description <textarea name="seo_description" rows="2"></textarea></label>
      </fieldset>

      <button type="submit" class="btn btn--primary">Save Changes</button>
    </form>
  </div>
</div>

<template id="itemRowTemplate">
  <div class="item-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
    <select class="item-content-type" style="flex:1">
      <option value="casino">Casino</option>
      <option value="sportsbook">Sportsbook</option>
      <option value="affiliate_partner">Affiliate Partner</option>
      <option value="custom">Custom</option>
    </select>
    <input type="number" class="item-id" placeholder="Item ID" style="flex:1">
    <button type="button" class="btn btn--ghost btn--sm remove-item-row">✕</button>
  </div>
</template>

<template id="criterionRowTemplate">
  <div class="criterion-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
    <input type="text" class="criterion-key" placeholder="key" style="flex:1">
    <input type="text" class="criterion-label" placeholder="Label" style="flex:1">
    <button type="button" class="btn btn--ghost btn--sm remove-criterion-row">✕</button>
  </div>
</template>
