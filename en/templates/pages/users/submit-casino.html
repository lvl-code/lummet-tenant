<div class="admin-wrapper">
  <nav class="admin-nav">
    <a href="/en/user/dashboard">Overview</a>
    <a href="/en/user/submit-casino" class="active">Submit Casino</a>
    <a href="/en/user/inquiries">My Inquiries</a>
    <a href="/en/user/profile">Profile</a>
    <a href="/en/user/notifications">Notifications</a>
    <a href="/api/v1/auth/logout" class="admin-logout">Logout</a>
  </nav>
  <div class="admin-content">
    <h1>Submit a Casino</h1>
    <form id="userCasinoForm" class="admin-form">
      <div class="form-group"><label>Casino Name *</label><input type="text" name="name" required></div>
      <div class="form-group"><label>Website URL *</label><input type="text" name="website_url" required></div>
      <div class="form-group"><label>Affiliate URL</label><input type="text" name="affiliate_url"></div>
      <div class="form-group"><label>Bonus Info</label><input type="text" name="bonus_value"></div>
      <div class="form-group"><label>Notes</label><textarea name="notes" placeholder="Tell us about this casino..."></textarea></div>
      <div id="userCasinoAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Submit for Review</button>
    </form>
  </div>
</div>
