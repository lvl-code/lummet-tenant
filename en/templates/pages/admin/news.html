<div class="admin-wrapper">
  <nav class="admin-nav">
    <a href="/en/dashboard">Overview</a>
    <a href="/en/dashboard/casinos">Casinos</a>
    <a href="/en/dashboard/casino/create">Add Casino</a>
    <a href="/en/dashboard/reviews">Reviews</a>
    <a href="/en/dashboard/news" class="active">News</a>
    <a href="/en/dashboard/pages">Pages</a>
    <a href="/en/dashboard/settings">Settings</a>
    <a href="/en/dashboard/ai">AI Generator</a>
    <a href="/en/api/v1/auth/logout" class="admin-logout">Logout</a>
  </nav>
  <div class="admin-content">
    <div class="admin-header"><h1>News</h1></div>
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Author</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody id="newsTableBody"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
    </table>

    <h2 style="margin-top:30px">Add News Article</h2>
    <form id="newsForm" class="admin-form">
      <div class="form-row">
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required></div>
        <div class="form-group"><label>Author</label><input type="text" name="author" value="Admin"></div>
      </div>
      <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
      <div class="form-group"><label>Content *</label><textarea name="content" required></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div id="newsFormAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Create Article</button>
    </form>
  </div>
</div>
