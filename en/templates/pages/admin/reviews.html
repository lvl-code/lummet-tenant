<div class="admin-wrapper">
  <nav class="admin-nav">
    <a href="/en/dashboard">Overview</a>
    <a href="/en/dashboard/casinos">Casinos</a>
    <a href="/en/dashboard/casino/create">Add Casino</a>
    <a href="/en/dashboard/reviews" class="active">Reviews</a>
    <a href="/en/dashboard/news">News</a>
    <a href="/en/dashboard/pages">Pages</a>
    <a href="/en/dashboard/categories">Categories</a>
    <a href="/en/dashboard/countries">Countries</a>
    <a href="/en/dashboard/components">Components</a>
    <a href="/en/dashboard/seo">SEO Meta</a>
    <a href="/en/dashboard/settings">Settings</a>
    <a href="/en/dashboard/ai">AI Generator</a>
    <a href="/en/api/v1/auth/logout" class="admin-logout">Logout</a>
  </nav>
  <div class="admin-content">
    <div class="admin-header">
      <h1>Reviews</h1>
    </div>
    <table class="admin-table">
      <thead>
        <tr><th>Title</th><th>Casino</th><th>Country</th><th>Rating</th><th>Actions</th></tr>
      </thead>
      <tbody id="reviewsTableBody">
        <tr><td colspan="5" class="muted">Loading...</td></tr>
      </tbody>
    </table>

    <h2 style="margin-top:30px">Add Review</h2>
    <form id="reviewForm" class="admin-form">
      <div class="form-row">
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required></div>
        <div class="form-group"><label>Casino Slug *</label><input type="text" name="casino_slug" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Country Code</label><input type="text" name="country_code" placeholder="RW or leave blank"></div>
        <div class="form-group"><label>Rating (0-5)</label><input type="number" name="rating" min="0" max="5" step="0.1" value="0"></div>
      </div>
      <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
      <div class="form-group"><label>Content *</label><textarea name="content" required></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Pros (one per line)</label><textarea name="pros"></textarea></div>
        <div class="form-group"><label>Cons (one per line)</label><textarea name="cons"></textarea></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div id="reviewFormAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Create Review</button>
    </form>
  </div>
</div>
