<h1>Best Online Casinos</h1>

<p>
Welcome to LevelCasino.
</p>

<!-- templates/pages/home.html -->
<section class="hero">
  <div class="hero-content">
    <h1>Premium Casino Reviews & Bonuses</h1>
    <p>Discover the world's most trusted online casinos with exclusive VIP bonuses and expert reviews.</p>
  </div>
</section>

<section class="casino-listings">
  <div class="container">
    <h2>Top Rated Casinos</h2>
    <div id="casino-grid" class="casino-grid">
      <div class="loading">Loading casinos...</div>
    </div>
  </div>
</section>

<script>
  // Parse casinos injected by server
  const casinoData = JSON.parse('{{casinos}}' || '[]');
  
  function renderStars(rating) {
    const stars = Math.round(rating || 0);
    return '★'.repeat(stars) + '☆'.repeat(5 - stars);
  }
  
  function renderCasinos() {
    const grid = document.getElementById('casino-grid');
    
    if (!casinoData || casinoData.length === 0) {
      grid.innerHTML = '<div class="empty-state">No casinos available at the moment.</div>';
      return;
    }
    
    // Sort featured first
    const sorted = [...casinoData].sort((a, b) => (b.featured || 0) - (a.featured || 0));
    
    grid.innerHTML = sorted.map(casino => {
      const features = JSON.parse(casino.features || '[]');
      const featureTags = features.slice(0, 3).map(f => `<span class="tag">${f}</span>`).join('');
      
      return `
        <article class="casino-card ${casino.featured ? 'featured' : ''}" data-slug="${casino.slug}">
          ${casino.featured ? '<div class="featured-badge">FEATURED</div>' : ''}
          <div class="card-header">
            <img src="${casino.logo || '/en/static/images/logo.png'}" alt="${casino.name}" class="casino-logo" loading="lazy">
            <div class="casino-meta">
              <h3>${casino.name}</h3>
              <div class="rating" title="Rating: ${casino.rating}/5">
                <span class="stars">${renderStars(casino.rating)}</span>
                <span class="rating-value">${casino.rating || '0.0'}</span>
              </div>
            </div>
          </div>
          
          <div class="card-body">
            <div class="bonus-box">
              <div class="bonus-label">Welcome Bonus</div>
              <div class="bonus-title">${casino.bonus_title || 'Exclusive Offer'}</div>
              <div class="bonus-value">${casino.bonus_value || ''}</div>
            </div>
            <div class="features">
              ${featureTags}
            </div>
          </div>
          
          <div class="card-footer">
            <a href="/en/go/${casino.slug}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
              Play Now
            </a>
            <a href="/en/casino/${casino.slug}" class="btn btn-secondary">
              Read Review
            </a>
          </div>
        </article>
      `;
    }).join('');
  }
  
  // Initialize
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderCasinos);
  } else {
    renderCasinos();
  }
</script>
