<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <h1>Settings</h1>
    <form id="settingsForm" class="admin-form">
      <div class="form-group"><label>Site Name</label><input type="text" name="site_name" placeholder="{{site_name}}"></div>
      <div class="form-group"><label>Site URL</label><input type="text" name="site_url" placeholder="{{site_url}}"></div>
      <div class="form-group"><label>Contact Email</label><input type="email" name="contact_email"></div>
      <div class="form-group"><label>Default Country</label><input type="text" name="default_country" placeholder="RW"></div>
      <div class="form-group"><label>Footer Text</label><input type="text" name="footer_text"></div>
      <div id="settingsFormAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Save Settings</button>
    </form>
  </div>
</div>
