<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header"><h1>News</h1></div>
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Author</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody id="newsTableBody"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
    </table>

    <h2 style="margin-top:30px">Add News Article</h2>
    <form id="newsForm"  class="admin-form" data-slug="">
      <input type="hidden" name="id" id="newsId" value="">
      <div class="form-row">
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required></div>
        <div class="form-group"><label>Author</label><input type="text" name="author" value="Admin"></div>
        <div class="form-group">
          <label>Linked Author</label>
          <select name="author_id" id="newsAuthorSelect">
            <option value="">No author assigned</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
      <div class="form-group"><label>Content *</label>                <textarea name="content" id="content" rows="15" placeholder="Enter article content..."
                    data-rich-editor data-editor-id="news-content" data-editor-folder="news"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div id="newsFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="newsSubmitBtn">Create Article</button>
        <button type="button" class="btn btn--ghost btn--lg" id="newsCancelEdit" style="display:none" onclick="cancelNewsEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>
</div>
