  <div class="admin-content">
    <div class="admin-header"><h1>Categories</h1></div>
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Slug</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody id="categoriesTableBody"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
    </table>
    <h2 style="margin-top:30px">Add Category</h2>
    <form id="categoryForm" class="admin-form">
      <div class="form-row">
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required placeholder="crypto"></div>
        <div class="form-group"><label>Name *</label><input type="text" name="name" required></div>
      </div>
      <div class="form-group"><label>Description</label><textarea name="description"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div id="categoryFormAlert" class="alert" style="display:none"></div>
      <button type="submit" class="btn btn--primary btn--lg">Create Category</button>
    </form>
  </div>
</div>
