<h1>Best Online Casinos</h1>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: #fff;
  }

  .hero {
    padding: 80px 20px;
    text-align: center;
    background: linear-gradient(135deg, #141e30, #243b55);
  }

  .hero h1 {
    font-size: 42px;
    margin-bottom: 10px;
  }

  .hero p {
    font-size: 18px;
    opacity: 0.85;
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
  }

  h2 {
    margin-bottom: 20px;
  }

  .casino-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .casino-card {
    background: #151c2e;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: 0.3s;
  }

  .casino-card:hover {
    transform: translateY(-5px);
  }

  .featured {
    border: 2px solid gold;
  }

  .featured-badge {
    background: gold;
    color: #000;
    padding: 4px 8px;
    font-size: 12px;
    display: inline-block;
    border-radius: 5px;
    margin-bottom: 10px;
  }

  .card-header {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .casino-logo {
    width: 50px;
    height: 50px;
    object-fit: contain;
  }

  .rating {
    font-size: 14px;
    opacity: 0.9;
  }

  .stars {
    color: gold;
  }

  .bonus-box {
    background: #0f1628;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
  }

  .tag {
    display: inline-block;
    background: #2b3550;
    padding: 4px 8px;
    margin: 2px;
    border-radius: 5px;
    font-size: 12px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
  }

  .btn {
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
  }

  .btn-primary {
    background: #00c853;
    color: #fff;
  }

  .btn-secondary {
    background: #1e2a44;
    color: #fff;
  }

  .loading,
  .empty-state {
    text-align: center;
    padding: 40px;
    opacity: 0.7;
  }

  .error {
    color: #ff4d4d;
    text-align: center;
    padding: 20px;
  }
</style>

<section class="hero">
  <div class="hero-content">
    <h1>Premium Casino Reviews & Bonuses</h1>
    <p>Discover the world's most trusted online casinos with exclusive VIP bonuses and expert reviews.</p>
  </div>
</section>

<section class="casino-listings">
  <div class="container">
    <h2>Top Rated Casinos</h2>

    <div id="casino-grid" class="casino-grid">
      <div class="loading">Loading casinos...</div>
    </div>
  </div>
</section>

<script>
const casinoData = {{casinos}};

function renderStars(rating) {
  rating = Math.round(Number(rating) || 0);
  return "★".repeat(rating) + "☆".repeat(5 - rating);
}

function renderCasinos() {
  const grid = document.getElementById("casino-grid");

  if (!Array.isArray(casinoData) || casinoData.length === 0) {
    grid.innerHTML = "<div class='empty-state'>No casinos available.</div>";
    return;
  }

  casinoData.sort((a, b) => (b.featured || 0) - (a.featured || 0));

  grid.innerHTML = casinoData.map(casino => {
    let features = [];

    try {
      features = JSON.parse(casino.features || "[]");
    } catch (e) {}

    return `
      <article class="casino-card ${casino.featured ? "featured" : ""}">
        <h3>${casino.name}</h3>
        <p>${casino.bonus_value || ""}</p>
      </article>
    `;
  }).join("");
}

renderCasinos();
</script>
