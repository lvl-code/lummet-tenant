<section class="casino-detail">
  <div class="container">
    <div class="casino-hero">
      <div class="casino-hero__left">
        <img src="{{logo}}" alt="{{name}}" class="casino-hero__logo" onerror="this.src='/en/static/images/logo.png'">
        <div>
          <h1>{{name}}</h1>
          <div class="rating-stars">{{rating_display}}</div>
        </div>
       </div>
      <div class="casino-hero__right">
        <div class="bonus-box">
          <span class="bonus-label">{{bonus_title}}</span>
          <span class="bonus-amount">{{bonus_value}}</span>
        </div>
        <a href="/en/go/{{slug}}" class="btn btn--primary btn--lg" rel="nofollow sponsored noopener">Claim Bonus</a>
        <a href="{{website_url}}" class="btn btn--ghost" target="_blank" rel="noopener">Visit Site</a>
      </div>
    </div>

    <div class="casino-body">
      <div class="casino-main">
        <div class="info-block">
          <h2>About {{name}}</h2>
          <p class="casino-description">{{seo_description}}</p>
        </div>

        <div class="info-block">
          <h3>Features</h3>
          <div class="features-list">
            {{features_html}}
          </div>
        </div>

        <div class="info-block" id="casinoReviews">
          <h3>Reviews</h3>
          <div id="reviewsContainer">
            <p class="muted">Loading reviews...</p>
          </div>
        </div>
      </div>

      <div class="casino-aside">
        <div class="info-card">
          <h4>Casino Info</h4>
          <dl>
            <dt>Rating</dt><dd>{{rating}} / 5</dd>
            <dt>Website</dt><dd><a href="{{website_url}}" target="_blank" rel="noopener">{{website_url}}</a></dd>
            <dt>Status</dt><dd>{{status}}</dd>
          </dl>
        </div>
        <div class="info-card" id="geoCard">
          <h4>Your Region</h4>
          <p class="muted">Detecting...</p>
        </div>
      </div>
    </div>
  </div>
</section>
